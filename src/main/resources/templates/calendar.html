<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendar</title>
  <link rel="stylesheet" th:href="@{/style.css}">
</head>

<body>
  <!-- header fragment -->
  <div th:replace="~{fragments/header :: header-section}"></div>

  <h2>Calendar</h2>
  <h3 th:text="${currentMonth}">Current Month</h3>
  
  <form id="calendar-form" method="GET">
    <div class="year-month-filter-container">
      <div>
        <label for="year-select">Year: </label>
        <select name="year" id="year-select">
          <option value="">--Select A Year--</option>
          <option th:each="yr : ${years}" th:value="${yr}" th:text="${yr}" th:selected="${yr == currentYear}"></option>
        </select>
      </div>

      <div>
        <label for="month-select">Month: </label>
        <select name="month" id="month-select">
          <option value="">--Select A Month--</option>
          <option th:each="mth : ${months}" th:value="${mth}" th:text="${mth}" th:selected="${mth.toUpperCase() == currentMonth.toUpperCase()}"></option>
        </select>
      </div>

      <div>
        <button type="submit">Select</button>
      </div>
    </div>
  </form>


  <div class="calendar-container">
    <div class="static-days-header">
      <div>Sun</div>
      <div>Mon</div>
      <div>Tue</div>
      <div>Wed</div>
      <div>Thu</div>
      <div>Fri</div>
      <div>Sat</div>
    </div>

    <div class="calendar-grid-section" id="calendar-grid">
      <div class="blank" th:each="blank : ${blanks}"></div>

      <div class="day" th:each="day : ${days}">
        <span th:text="${day}">1</span>
      </div>
    </div>
  </div>

  <script th:src="@{/javascript/leavecalanalysis.js}"></script>

  <!-- footer fragment -->
  <div th:replace="~{fragments/footer :: footer-section}"></div>

</body>
</html>
