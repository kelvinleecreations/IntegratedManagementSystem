<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pending Approval</title>
  <link rel="stylesheet" th:href="@{/style.css}">
</head>

<body>
  <!-- header fragment -->
  <div th:replace="~{fragments/header :: header-section}"></div>

  <!-- Flash Attributes -->
  <div th:replace="~{fragments/body :: flash-attributes-section}"></div>

  <a th:href="@{/staff/reviewedleave}">Reviewed Leave Archive</a>

  <h2>Pending Approval</h2>

  <!-- filter function -->
  <div>
    <form th:action="@{/staff/pendingapproval}" method="GET">
      <input type="text" name="search" th:value="${filter}" placeholder="Search by Username">
      <button type="submit">Search</button>
    </form>
  </div>

  <p th:if="${#lists.isEmpty(subordinatesApplications)}">You do not have any leave applications pending for approval by you.</p>

  <div class="leave-approval-container">
    <table th:unless="${#lists.isEmpty(subordinatesApplications)}" class="leave-approval-table">
      <thead>
        <tr>
          <th>Name</th>
          <th>Username</th>
          <th>Leave Type</th>
          <th>Leave Duration</th>
          <th>Leave Start Date</th>
          <th>Leave End Date</th>
          <th>Status</th>
          <th>Action</th>
        </tr>
      </thead>

      <tbody>
        <tr th:each="s : ${subordinatesApplications}">
          <td th:text="${s.user.name}"></td>
          <td th:text="${s.user.username}"></td>
          <td th:text="${s.leaveType}"></td>
          <td th:text="${s.leaveDuration}"></td>
          <td th:text="${s.startDate}"></td>
          <td th:text="${s.endDate}"></td>
          <td th:text="${s.applicationStatus}"></td>
          <td><a th:href="@{/staff/reviewleave(applicationId=${s.applicationId}, userId=${s.user.userId})}">Review</a></td>
    </table>
  </div>

  <!-- footer fragment -->
  <div th:replace="~{fragments/footer :: footer-section}"></div>

</body>
</html>
