<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<body>
  <!-- fragment for header across all pages -->
  <header th:fragment="header-section">
    <div class="header-logo-icon">
      <strong>Integrated Management System</strong>
    </div>

    <nav class="header-nav-icon">
      <!-- Welcome Page Header, with no user logged in -->
      <th:block sec:authorize="isAnonymous()">
        <a th:href="@{/}">Back to Welcome Page</a>
        <a th:href="@{/about}">About Us</a>
      </th:block>

      <!-- For user logged in -->
      <th:block sec:authorize="isAuthenticated()">

        <!-- Calendar Function, except admin -->
        <a sec:authorize="!hasRole('ADMIN')" th:href="@{/staff/calendar}">Calendar</a>

        <!-- Approval Function, for managers -->
        <a sec:authorize="hasAnyRole('CEO', 'HR_DIRECTOR', 'FINANCE_DIRECTOR', 'HR_MANAGER_R', 'HR_MANAGER_I', 'FINANCE_MANAGER')" th:href="@{/staff/pendingapproval}">Approval</a>

        <!-- Apply Leave Function, except admin, ceo and users without manager assigned -->
        <a sec:authorize="!hasRole('ADMIN') and !hasRole('CEO') and #authentication.principal.user.manager != null" th:href="@{/staff/applyleave}">Apply Leave</a>

        <!-- My Team Function, except admin -->
        <a sec:authorize="!hasRole('ADMIN')" th:href="@{/staff/myteam}">My Team</a>

        <!-- Administration Function, for admins only -->
        <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/administration}">Administration</a>

        <!-- HR Function, for HR only -->
        <a sec:authorize="hasAnyRole('HR_DIRECTOR', 'HR_MANAGER_R', 'HR_MANAGER_I', 'HR_RECRUITER', 'HR_INTERNAL')" th:href="@{/staff/hr}">HR</a>

        <!-- Finance Function, for Finance only -->
        <a sec:authorize="hasAnyRole('FINANCE_DIRECTOR', 'FINANCE_MANAGER', 'FINANCE_EMPLOYEE')" th:href="@{/staff/finance}">Finance</a>

        <!-- Profile Function, for every user -->
        <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/profile}">My Profile</a>
        <a sec:authorize="!hasRole('ADMIN')" th:href="@{/staff/profile}">My Profile</a>

        <!-- Home Page Function, for every user -->
        <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/index}">Home</a>
        <a sec:authorize="!hasRole('ADMIN')" th:href="@{/staff/index}">Home</a>

        <!-- Logout Function, for every user -->
        <form th:action="@{/logout}" method="POST">
          <button type="submit">Logout</button>
        </form>
      </th:block>
    </nav>
  </header>

  <!-- fragment for greeting user when logged in -->
  <div th:fragment="welcome-user-section">
     <!-- Thymeleaf Spring Security Dialect Engine bypasses the controller, checks the logged-in principal (SecurityUserDetails object) and calls getUsername(). This is essentially the same object injected in controller via AuthenticationPrincipal. -->
    <p>Welcome <span sec:authentication="name">Guest</span>.</p>
  </div>

</body>
</html>
